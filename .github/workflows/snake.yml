# ============================================================
# Workflow: Contribution Snake Animation 🐍
# Membuat animasi "ular makan kotak kontribusi" dari contribution
# graph GitHub, lalu push hasilnya ke branch "output" supaya bisa
# ditampilkan di profile README.
# ============================================================

name: generate-snake

# Kapan workflow ini jalan:
on:
  # 1) Otomatis setiap hari jam 00:00 UTC (midnight)
  schedule:
    - cron: "0 0 * * *"

  # 2) Otomatis setiap ada push ke branch main
  push:
    branches:
      - main

  # 3) Manual: buka tab Actions -> pilih workflow ini -> "Run workflow"
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Izin khusus untuk job ini: workflow boleh menulis ke repo,
    # supaya bisa push balik file SVG ke branch "output".
    # (GITHUB_TOKEN dibuat otomatis oleh GitHub, tidak perlu bikin manual)
    permissions:
      contents: write

    steps:
      # ----------------------------------------------------------
      # Step 1: Generate file SVG animasi ular.
      # Output dibuat di folder dist/ :
      #   - github-contribution-grid-snake.svg       -> versi LIGHT mode
      #   - github-contribution-grid-snake-dark.svg  -> versi DARK mode
      # (palette=github-dark = skema warna untuk tema gelap)
      # ----------------------------------------------------------
      - name: "Generate contribution snake SVGs"
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      # ----------------------------------------------------------
      # Step 2: Push isi folder dist/ ke branch "output" di repo yang
      # sama. Branch "output" ini dibuat otomatis kalau belum ada.
      # Setelah ini, file bisa diakses via:
      #   https://raw.githubusercontent.com/ZhyperReyz/ZhyperReyz/output/github-contribution-grid-snake.svg
      # ----------------------------------------------------------
      - name: "Push SVGs to the output branch"
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}